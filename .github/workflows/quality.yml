name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked project and development tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.1
          uv lock --check
          uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: Check formatting
        run: uv run ruff format --check src tests scripts launch_demo.py

      - name: Lint
        run: uv run ruff check src tests scripts launch_demo.py

      - name: Type check
        run: uv run mypy src tests/helpers/paper_process_worker.py

      - name: Test with coverage
        run: uv run pytest --cov=quantum_trader --cov-report=term-missing

      - name: Scan source for security issues
        run: uv run bandit -q -r src launch_demo.py

      - name: Audit locked dependencies and generate SBOM
        if: matrix.python-version == '3.12'
        run: |
          uv export --locked --extra dev --no-hashes --no-emit-project --output-file locked-requirements.txt
          uv run pip-audit --requirement locked-requirements.txt --format cyclonedx-json --output sbom.cdx.json

      - name: Upload security evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-evidence-python-${{ matrix.python-version }}
          path: |
            locked-requirements.txt
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate deployment and documentation assets
        run: |
          bash -n launch_demo.sh scripts/run-cloud-simulation.sh
          uv run python -m py_compile launch_demo.py scripts/*.py tests/helpers/*.py
          uv run python scripts/check-doc-links.py
          uv run python scripts/verify-evaluation-evidence.py
          uv run python scripts/verify-workflow-security.py

      - name: Build source and wheel distributions
        run: uv run python -m build

      - name: Verify installed wheel safety and bundled demo
        run: |
          python -m venv /tmp/qtp-wheel
          /tmp/qtp-wheel/bin/python -m pip install --upgrade pip
          /tmp/qtp-wheel/bin/python -m pip install dist/*.whl
          /tmp/qtp-wheel/bin/quantum-trader preflight
          /tmp/qtp-wheel/bin/quantum-trader demo --output /tmp/qtp-wheel-demo
          python scripts/verify-demo-output.py /tmp/qtp-wheel-demo

  launchers:
    name: Launcher ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Run portable Python launcher
        run: python launch_demo.py --output ci-demo-python

      - name: Verify portable Python output
        run: python scripts/verify-demo-output.py ci-demo-python

      - name: Run Unix double-click wrapper
        if: runner.os != 'Windows'
        run: ./launch_demo.sh --output ci-demo-wrapper

      - name: Run Windows double-click wrapper
        if: runner.os == 'Windows'
        shell: cmd
        run: launch_demo.cmd --output ci-demo-wrapper

      - name: Verify wrapper output
        run: python scripts/verify-demo-output.py ci-demo-wrapper
