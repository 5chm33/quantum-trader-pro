[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-trader-pro"
version = "0.1.0"
description = "A deterministic, simulation-only trading research engine with explicit risk and audit controls."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Thomas Nance"}]
keywords = ["algorithmic-trading", "backtesting", "simulation", "risk-management", "portfolio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.7.9",
  "build>=1.2.2,<2",
  "mypy>=1.11.0",
  "pip-audit>=2.7.3",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
quantum-trader = "quantum_trader.cli:main"

[project.urls]
Repository = "https://github.com/5chm33/quantum-trader-pro"
Issues = "https://github.com/5chm33/quantum-trader-pro/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantum_trader = ["py.typed", "data/*.csv"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: exercises multiple local components without network access",
  "smoke: invokes the installed command-line interface",
]

[tool.coverage.run]
branch = true
source = ["quantum_trader"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["quantum_trader"]
mypy_path = "src"
